<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root { color-scheme:light; --ink:#202923; --soft:#606862; --line:#d9ddd6; --accent:#235e52; --paper:#f5f5f2; --reading-size:17px; }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; color:var(--ink); background:#fff; font:16px/1.85 "Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
[hidden] { display:none!important; }
a { color:var(--accent); text-underline-offset:4px; }
a,button,summary,input { touch-action:manipulation; }
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
button,input { font:inherit; }
button { cursor:pointer; min-height:44px; border:1px solid var(--line); border-radius:6px; padding:8px 14px; background:#fff; color:var(--ink); font-size:13px; }
button[aria-pressed=true] { color:var(--accent); border-color:var(--accent); background:#eaf0eb; }
.skip { position:fixed; top:-80px; left:20px; background:white; z-index:20; padding:10px; }
.skip:focus { top:12px; }
.masthead { max-width:1240px; margin:auto; padding:24px 40px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:24px; }
.brand { font-size:14px; font-weight:600; color:var(--accent); }
.masthead nav { display:flex; gap:20px; flex-wrap:wrap; font-size:13px; }
.masthead a { display:inline-flex; align-items:center; min-height:44px; text-decoration:none; }
.layout { display:grid; grid-template-columns:228px minmax(0,1fr); gap:64px; max-width:1240px; margin:0 auto; padding:40px; }
aside { position:sticky; top:24px; align-self:start; max-height:calc(100vh - 48px); overflow:auto; scrollbar-width:thin; }
aside summary { cursor:pointer; padding:8px 0; min-height:44px; font-size:14px; font-weight:500; }
aside nav { counter-reset:chapter; margin-top:12px; }
aside nav a { display:flex; gap:10px; text-decoration:none; color:var(--soft); font-size:13px; line-height:1.6; padding:10px 8px; min-height:44px; border-left:2px solid transparent; overflow-wrap:anywhere; }
aside nav a::before { counter-increment:chapter; content:counter(chapter,decimal-leading-zero); font-size:11px; min-width:18px; padding-top:2px; font-variant-numeric:tabular-nums; }
aside nav a[aria-current=location] { color:var(--accent); border-left-color:var(--accent); background:var(--paper); }
aside small { display:block; color:var(--soft); font-size:12px; margin-top:16px; }
main { min-width:0; max-width:800px; }
.reader-tools { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
.reader-tools span { margin-right:auto; color:var(--soft); font-size:12px; }
.report-meta { display:flex; flex-wrap:wrap; gap:12px 28px; padding:16px 0; margin:0 0 32px; border-block:1px solid var(--line); }
.report-meta div { display:flex; gap:8px; align-items:baseline; font-size:12px; }
.report-meta dt { color:var(--soft); }
.report-meta dd { margin:0; color:var(--ink); font-size:14px; font-variant-numeric:tabular-nums; }
.report-content { font-size:var(--reading-size); }
h1 { font-size:clamp(30px,3.5vw,44px); line-height:1.35; letter-spacing:-.025em; font-weight:500; margin:0 0 24px; text-wrap:pretty; }
h2 { font-size:26px; line-height:1.5; font-weight:500; margin:0 0 24px; scroll-margin-top:28px; }
h3 { font-size:19px; line-height:1.6; font-weight:600; margin:32px 0 12px; }
p,li,h1,h2,h3 { overflow-wrap:anywhere; }
p { margin:14px 0; }
ul { padding-left:24px; margin:16px 0; }
li { padding:5px 0; }
.report-content>p:first-of-type { font-size:20px; color:var(--accent); line-height:1.75; }
.report-content>p:nth-of-type(2) { color:var(--soft); font-size:13px; margin-bottom:36px; }
.report-section { padding:36px 0 12px; margin-top:28px; border-top:1px solid var(--line); }
.report-section:first-of-type { border-top:2px solid var(--accent); }
.report-section:target { scroll-margin-top:24px; }
.report-section .evidence-line { color:var(--soft); font-size:13px; }
.reader-end { display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px; border-top:1px solid var(--line); padding-top:28px; margin-top:48px; color:var(--soft); font-size:13px; }
.reader-end a { min-height:44px; display:inline-flex; align-items:center; }
footer { max-width:1240px; margin:auto; border-top:1px solid var(--line); padding:24px 40px; color:var(--soft); font-size:12px; }
#reading-progress { position:fixed; top:0; left:0; width:100%; height:3px; border:0; accent-color:var(--accent); z-index:5; }
#reading-progress::-webkit-progress-bar { background:transparent; }
#reading-progress::-webkit-progress-value { background:var(--accent); }
.focus-reading aside { display:none; }
.focus-reading .layout { display:block; max-width:880px; }
.large-type { --reading-size:20px; }
@media(max-width:1000px) { .layout { gap:36px; grid-template-columns:190px minmax(0,1fr); padding:32px 28px; } }
@media(max-width:820px) {
  .layout { grid-template-columns:1fr; gap:24px; padding:24px; }
  aside { position:static; max-height:none; border-bottom:1px solid var(--line); padding-bottom:8px; }
  aside nav { max-height:320px; overflow:auto; }
  aside small { display:none; }
  .masthead,footer { padding:20px 24px; }
  .masthead { align-items:flex-start; flex-direction:column; gap:4px; }
  .masthead nav { gap:8px 20px; }
}
@media(max-width:480px) {
  .layout,.focus-reading .layout { padding:24px 20px; }
  .masthead,footer { padding:16px 20px; }
  .report-content { font-size:var(--reading-size); }
  .reader-tools { gap:8px; margin-bottom:24px; }
  .reader-tools span { width:100%; }
  h1 { font-size:30px; }
  h2 { font-size:23px; }
  .report-meta { gap:8px 20px; margin-bottom:24px; }
  .report-section { margin-top:24px; padding-top:28px; }
}
@media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
@media print {
  .masthead nav,aside,.reader-tools,.reader-end,#reading-progress,.skip { display:none!important; }
  .layout,.focus-reading .layout { display:block; max-width:none; padding:0; }
  main { max-width:none; }
  .masthead,footer { padding:12px 0; }
  body,.report-content,.large-type .report-content { font-size:11pt; }
  h1 { font-size:24pt; } h2 { font-size:17pt; } h3 { font-size:13pt; }
  h1,h2,h3 { break-after:avoid; }
  p,li { orphans:3; widows:3; }
  .report-section { margin-top:18px; padding-top:18px; }
  a { color:inherit; } @page { margin:18mm; }
}
</style>
</head>
<body id="top">
<a class="skip" href="#report-content">跳转到正文</a>
<progress id="reading-progress" value="0" max="100" aria-label="页面滚动位置" hidden></progress>
<header class="masthead"><span class="brand">论文开讲 / 精读报告</span><nav aria-label="相关产物">__LINKS__</nav></header>
<div class="layout">
<aside><details id="contents" open><summary>阅读目录</summary><nav aria-label="报告目录">__TOC__</nav></details><small>可按章节跳读；完整证据与阅读限制始终保留。</small></aside>
<main>
<div class="reader-tools" hidden><span id="reading-location">从研究问题开始</span><button id="reader-focus" type="button" aria-pressed="false">专注阅读</button><button id="reader-type" type="button" aria-pressed="false">大字阅读</button></div>
<dl class="report-meta">__REPORT_META__</dl>
<article class="report-content" id="report-content" tabindex="-1">__REPORT__</article>
<div class="reader-end"><p>读完后，试着用自己的话解释核心结论与它的边界。</p><a href="#top">返回页首</a></div>
</main>
</div>
<footer>AI 辅助研究产物 · 结构检查不等于科学结论已获独立验证。请结合原文、阅读限制与发布复核记录使用。</footer>
<script>
(() => {
  const root=document.documentElement, contents=document.getElementById('contents');
  const links=[...document.querySelectorAll('aside nav a')];
  const headings=[...document.querySelectorAll('.report-section h2')];
  const progress=document.getElementById('reading-progress');
  document.querySelector('.reader-tools').hidden=false; progress.hidden=false;
  const compact=matchMedia('(max-width:820px)');
  const adapt=()=>{contents.open=!compact.matches;};
  compact.addEventListener('change',adapt); adapt();
  const toggles=[['reader-focus','focus-reading'],['reader-type','large-type']];
  toggles.forEach(([id,cls])=>document.getElementById(id).addEventListener('click',()=>{
    const enabled=root.classList.toggle(cls);
    document.getElementById(id).setAttribute('aria-pressed',String(enabled)); update();
  }));
  let scheduled=false;
  function update(){
    scheduled=false;
    const max=document.documentElement.scrollHeight-innerHeight;
    progress.value=max>0?Math.round(100*Math.min(1,Math.max(0,scrollY/max))):100;
    let active=-1;
    headings.forEach((heading,i)=>{if(heading.getBoundingClientRect().top<=140)active=i;});
    links.forEach((link,i)=>{if(i===active)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');});
    document.getElementById('reading-location').textContent=active<0?'从研究问题开始':'当前位置：'+headings[active].textContent;
  }
  function schedule(){if(!scheduled){scheduled=true;requestAnimationFrame(update);}}
  addEventListener('scroll',schedule,{passive:true}); addEventListener('resize',schedule);
  addEventListener('hashchange',schedule); update();
})();
</script>
</body>
</html>
