<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研究逻辑链</title>
<style>
:root{color-scheme:light;--bg:#f5f5f2;--panel:#fff;--ink:#202923;--soft:#606862;--line:#d9ddd6;--accent:#235e52;--pale:#eaf0eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,"Microsoft Yahei",sans-serif}
main{max-width:1120px;margin:auto;padding:40px 28px}header{max-width:850px}h1{font-size:clamp(26px,4vw,40px);line-height:1.25;margin:10px 0 20px}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--accent)}.lead{color:var(--soft)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:24px 0}button{font:inherit;min-height:44px;padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:default}#play{background:var(--accent);color:var(--bg);font-weight:600}
.layout{display:grid;grid-template-columns:minmax(240px, .8fr) minmax(300px,1.2fr);gap:32px;align-items:start}
#chain{padding:0;margin:0;list-style:none}.node{position:relative;margin:0 0 26px;padding:0}
.node:not(:last-child):after{content:"↓";position:absolute;left:23px;bottom:-27px;color:var(--soft);font-size:20px}
.node button{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px 16px;transition:transform .25s ease,background .25s ease}
.node[aria-current=true] button{background:var(--pale);border-color:var(--accent);transform:translateX(5px)}
.number{font-variant-numeric:tabular-nums;color:var(--accent);font-size:22px;min-width:28px}
.detail{padding:26px;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0}
h2{margin:0 0 18px;font-size:25px;line-height:1.4}.relation{color:var(--accent);font-size:14px}.tag{font-size:12px;color:var(--accent)}
.claim{border-top:1px solid var(--line);padding:16px 0}.boundary{color:var(--soft);font-size:14px}
details{font-size:14px;overflow-wrap:anywhere}summary{cursor:pointer;padding:10px 0}a{color:var(--accent)}
#meter{height:5px;background:var(--line);margin:16px 0 28px}#fill{height:100%;width:0;background:var(--accent)}
footer{color:var(--soft);font-size:13px;margin-top:28px}.reduced{color:var(--soft);font-size:13px}
@media(max-width:680px){main{padding:24px 18px}.layout{grid-template-columns:1fr}.detail{padding:20px;grid-row:1}.node button{padding:10px 14px}.toolbar{gap:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.node[aria-current=true] button{transform:none}}
body{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}h1,h2{font-weight:500;letter-spacing:-.02em}button,.detail{border-radius:3px}.node[aria-current=true] button{transform:none}.node:not(:last-child):after{content:"";height:18px;border-left:1px solid var(--line);bottom:-22px}.node button{transition:background .2s}.hidden{display:none!important}.scene{border-top:1px solid var(--line);padding-top:20px;margin-top:24px}.scene-question{font-size:20px;line-height:1.6;font-weight:500;margin:8px 0 20px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:16px}.condition{padding:20px;background:var(--bg);min-width:0;overflow-wrap:anywhere}.condition small{color:var(--soft);font-size:12px}.condition p{margin:12px 0 0;font-size:17px;line-height:1.75}.condition.after{background:var(--pale);border-top:2px solid var(--accent)}.masked #after{visibility:hidden}.masked .after:after{content:"先形成你的预测，再揭示变化。";font-size:14px;color:var(--soft)}#reveal{margin:20px 0 8px;border-color:var(--accent);color:var(--accent)}#takeaway{font-size:15px;color:var(--accent)}.presentation main{max-width:1440px}.presentation .layout{grid-template-columns:1fr}.presentation #chain,.presentation #claims,.presentation header .lead{display:none}.presentation .detail{padding:40px;min-height:55vh}.presentation .condition p{font-size:clamp(20px,2.5vw,32px)}.presentation .scene-question{font-size:28px}.presentation h2{font-size:32px}.presentation #explanation{max-width:75ch}.keyboard-note{font-size:12px;color:var(--soft)}@media(max-width:680px){.comparison{grid-template-columns:1fr}.presentation .detail{padding:20px}.scene-question{font-size:18px}.condition{padding:16px}main{padding:24px 18px}}
</style>
<style>
/* The explanation is a canvas, not a card inside a card. */
:root{--bg:#f8f8f5}main{padding:32px 24px}.detail{padding:0 0 0 32px;background:transparent;border:0;border-left:1px solid var(--line);border-radius:0}.node button{border:0;border-radius:0;background:none;padding:14px 0;border-bottom:1px solid var(--line)}.node[aria-current=true] button{background:none;border-bottom-color:var(--accent);color:var(--accent)}.node:not(:last-child):after{display:none}.node{margin-bottom:8px}.number{font-size:16px;color:var(--soft)}.node[aria-current=true] .number{color:var(--accent)}.layout{grid-template-columns:minmax(200px,.7fr) minmax(0,1.3fr);gap:32px}.toolbar button{border-color:transparent;background:#eeefeb;border-radius:7px;font-size:14px}#play{background:var(--accent);color:white}.toolbar{gap:8px}.condition{border-radius:7px;background:#eeefeb;padding:20px}.condition.after{border:0;background:var(--pale)}.scene{padding-top:24px}.claim{margin-top:20px}.presentation .detail{padding:24px 0;border:0;background:none}.presentation .condition{padding:28px}.eyebrow{font-size:11px}h1{font-size:clamp(25px,3.5vw,36px)}.lead{font-size:14px;line-height:1.8}#reveal{border:0;background:var(--accent);color:white;border-radius:7px;font-size:14px}.comparison{gap:12px}.relation{font-size:12px}#position{font-size:12px;color:var(--soft);margin-left:8px}#explanation{font-size:16px;line-height:1.85}.scene-question{font-size:19px}#meter{height:3px}@media(max-width:680px){main{padding:24px 0}.layout{grid-template-columns:1fr;gap:28px}.detail{border:0;padding:0}.detail h2{font-size:24px}.node button{padding:12px 0}.presentation .detail{padding:0}.comparison{grid-template-columns:1fr 1fr}.condition{padding:16px}.condition p{font-size:15px}.scene-question{font-size:18px}.toolbar button{padding:8px 12px}}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">RESEARCH / LOGIC WALKTHROUGH</div><h1 id="title"></h1>
<p class="lead">逐步查看研究如何从问题走向方法、证据与边界。每个节点都可以回到支持它的论断。</p></header>
<div class="toolbar">
<button id="prev" type="button">上一步</button><button id="play" type="button">播放</button>
<button id="next" type="button">下一步</button><button id="present" type="button" aria-pressed="false">演示视图</button><span id="position" aria-live="polite"></span>
</div>
<div id="meter" role="progressbar" aria-label="逻辑链进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div>
<div class="layout"><ol id="chain" aria-label="逻辑节点"></ol>
<section class="detail" aria-labelledby="node-title">
<p id="relation" class="relation"></p><h2 id="node-title"></h2><p id="explanation"></p>
<section id="scene" class="scene hidden" aria-label="预测与对照">
<span class="tag">先预测，再检查</span><h3 id="scene-question" class="scene-question"></h3>
<div id="comparison" class="comparison masked"><div class="condition"><small>条件 A / 起点</small><p id="before"></p></div><div class="condition after"><small>条件 B / 改变后</small><p id="after"></p></div></div>
<button id="reveal" type="button" aria-expanded="false">揭示变化</button><p id="takeaway" class="hidden"></p>
</section>
<div id="claims"></div></section></div>
<p id="motion-note" class="reduced"></p>
<p class="keyboard-note">键盘 ← / → 切换步骤，Esc 退出演示。左栏是阅读顺序，不自动表示因果。</p>
<footer>教学逻辑示意；对照条件和结论来自研究底稿。此页面不是定量物理仿真。自动播放仅在点击后开始，结束后停止。</footer>
</main>
<script id="data" type="application/json">__RESEARCH_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent);
const byId=(items)=>Object.fromEntries(items.map(x=>[x.id,x]));
const claims=byId(data.claims), evidence=byId(data.evidence), sources=byId(data.sources);
const relations={motivates:'提出动机',requires:'依赖前提',supports:'提供支持',contrasts:'形成对照',limits:'限定边界',enables:'使下一步可行',causes:'因果关系'};
const types={author_claim:'作者主张',observation:'观测／证据',inference:'补充推断'};
let index=0,timer=null,elapsed=0,last=0,revealed=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const $=(id)=>document.getElementById(id);
function el(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
$('title').textContent=data.title;document.title=data.title+' · 逻辑链';
data.nodes.forEach((n,i)=>{const li=el('li','','node'),b=el('button','');b.type='button';b.append(el('span',String(i+1).padStart(2,'0'),'number'),el('span',n.label));b.addEventListener('click',()=>{pause();show(i)});li.append(b);$('chain').append(li)});
function show(i){
index=i;elapsed=0;const n=data.nodes[i],previous=data.nodes[i-1];
const edge=previous&&data.edges.find(e=>e.from===previous.id&&e.to===n.id);
$('relation').textContent=edge?relations[edge.relation]+'：'+edge.reason:(i?'下一知识点':'从研究问题出发');
$('node-title').textContent=n.label;$('explanation').textContent=n.explanation;
const scene=(data.scenes||[]).find(s=>s.node_id===n.id);
$('scene').classList.toggle('hidden',!scene);revealed=false;$('comparison').classList.add('masked');$('reveal').textContent='揭示变化';$('reveal').setAttribute('aria-expanded','false');$('takeaway').classList.add('hidden');
if(scene){$('scene-question').textContent=scene.question;$('before').textContent=scene.before;$('after').textContent=scene.after;$('takeaway').textContent=scene.takeaway}
$('position').textContent=(i+1)+' / '+data.nodes.length;
[...$('chain').children].forEach((li,j)=>li.setAttribute('aria-current',String(j===i)));
$('claims').replaceChildren();
n.claim_ids.forEach(id=>{
 const c=claims[id],box=el('div','','claim');box.append(el('span',id+' · '+types[c.type],'tag'),el('p',c.text),el('p','边界：'+c.boundary,'boundary'));
 const details=el('details','');details.append(el('summary','查看原文证据与定位'));
 c.evidence_ids.forEach(eid=>{const e=evidence[eid],s=sources[e.source_id];details.append(el('p',eid+' · '+s.title+' · '+e.location+' ['+e.verification+']'),el('p',e.observation));
 const loc=s.location||'';if(/^https?:\/\//i.test(loc)){const a=el('a','打开来源');a.href=loc;a.target='_blank';a.rel='noopener noreferrer';details.append(a)}else details.append(el('p',loc));
 });box.append(details);$('claims').append(box);
});$('prev').disabled=i===0;$('next').disabled=i===data.nodes.length-1;progress();
}
function progress(){const value=100*(index+1)/data.nodes.length;$('fill').style.width=value+'%';$('meter').setAttribute('aria-valuenow',String(Math.round(value)))}
function pause(){if(timer!==null)cancelAnimationFrame(timer);timer=null;$('play').textContent='播放'}
function reveal(){revealed=!revealed;$('comparison').classList.toggle('masked',!revealed);$('takeaway').classList.toggle('hidden',!revealed);$('reveal').textContent=revealed?'收起解释，重新预测':'揭示变化';$('reveal').setAttribute('aria-expanded',String(revealed))}
function tick(now){elapsed+=Math.min(now-last,250);last=now;if(!revealed&&elapsed>=500*(data.seconds_per_step||7))reveal();if(elapsed>=1000*(data.seconds_per_step||7)){if(index===data.nodes.length-1){pause();return}show(index+1)}timer=requestAnimationFrame(tick)}
$('reveal').addEventListener('click',()=>{pause();reveal()});
$('present').addEventListener('click',()=>{const active=document.documentElement.classList.toggle('presentation');$('present').setAttribute('aria-pressed',String(active));$('present').textContent=active?'退出演示':'演示视图'});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select'))return;if(e.key==='ArrowRight'){$('next').click();e.preventDefault()}if(e.key==='ArrowLeft'){$('prev').click();e.preventDefault()}if(e.key==='Escape'&&document.documentElement.classList.contains('presentation'))$('present').click()});
$('play').addEventListener('click',()=>{if(timer!==null){pause();return}if(index===data.nodes.length-1)show(0);$('play').textContent='暂停';last=performance.now();timer=requestAnimationFrame(tick)});
$('prev').addEventListener('click',()=>{pause();show(Math.max(0,index-1))});
$('next').addEventListener('click',()=>{pause();show(Math.min(data.nodes.length-1,index+1))});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function motion(){pause();$('motion-note').textContent=reduced.matches?'已按系统设置减少移动效果；仍可手动逐步查看。':''}
reduced.addEventListener('change',motion);motion();show(0);
</script>
</body></html>
